[project]
name = "py-loose-version-comparator"
version = "0.1.0"
description = "Compares version strings by splitting them into digit and non-digit tokens."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
